name: Deploy Shiny Apps

# Path-filtered: only redeploys the app subdirectory that actually changed.
# See SPEC-shiny-apps-location-2026-08-03.md (mediationverse repo) for the
# design record behind this workflow's decisions.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'

jobs:
  detect-changed-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changed app subdirectories
        id: filter
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- apps/ | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "changes=$changed" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-changed-apps
    if: needs.detect-changed-apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changed-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Restore R packages from renv
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: apps/${{ matrix.app }}

      - name: Install rsconnect
        working-directory: apps/${{ matrix.app }}
        run: Rscript -e "install.packages('rsconnect')"

      - name: Write manifest.json
        working-directory: apps/${{ matrix.app }}
        run: Rscript -e "rsconnect::writeManifest('.')"

      - name: Deploy to Connect Cloud
        working-directory: apps/${{ matrix.app }}
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
        run: |
          Rscript -e '
            rsconnect::connectApiUser(
              server = Sys.getenv("CONNECT_SERVER"),
              apiKey = Sys.getenv("CONNECT_API_KEY")
            )
            rsconnect::deployApp(appDir = ".", forceUpdate = TRUE)
          '
